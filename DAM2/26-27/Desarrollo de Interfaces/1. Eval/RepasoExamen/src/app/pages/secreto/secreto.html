<main class="page">
  <a routerLink="/" class="back">← Volver a ejercicios</a>
  <header>
    <span>Ejercicio 01 · Nivel ★★</span>
    <h1>Adivina el número secreto</h1>
    <p>El número está entre 1 y 100. Tienes siete intentos.</p>
  </header>
  <section class="panel">
    <div class="attempts">
      Intentos <strong>{{ attempts() }} / 7</strong>
    </div>
    <label for="guess">Tu apuesta</label>
    <div class="row">
      <input
        id="guess"
        type="number"
        min="1"
        max="100"
        [(ngModel)]="guess"
        [disabled]="finished()"
        (keyup.enter)="tryGuess()"
      /><button (click)="tryGuess()" [disabled]="finished()">Probar</button>
    </div>
    <p [class.success]="won()">{{ message() }}</p>
    @if (finished()) {
      <button class="secondary" (click)="newGame()">Nueva partida</button>
    }
  </section>
  <p>
    Mejor marca: <strong>{{ best() ? best() + ' intentos' : 'sin conseguir todavía' }}</strong>
  </p>
</main>
