<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3 class="text-center">{{ 'login.title' | translate }}</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label for="username">{{ 'login.username' | translate }}</label>
              <input type="text" id="username" formControlName="username" class="form-control">
            </div>
            <div class="form-group">
              <label for="password">{{ 'login.password' | translate }}</label>
              <input type="password" id="password" formControlName="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-3" [disabled]="loginForm.invalid">{{ 'login.login' | translate }}</button>
            @if (error) {
              <div class="alert alert-danger mt-3">{{ error }}</div>
            }
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
